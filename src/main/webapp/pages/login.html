        <div class="conteudo a">
                <h1>Acesse sua conta!</h1>
                <form action="" id="e-senha">
                    <div>
                        <label for="email">E-mail</label>
                    <input type="email" name="" required id="email" placeholder="Digite aqui  seu e-mail">
                    </div>
                    
                    <div>
                        <label for="senha">Senha</label>
                    <input type="password" name="" required id="senha" placeholder="Digite aqui  sua senha">
                    </div>
                    <div class="botao"><button type="submit">Fazer Login
                </button></div>
                </form> 
                
        </div>

                    <h3>Dados da empresa</h3>
                    <div>
                        <label for="nome">Nome da empresa</label>
                    <input type="text" name="" id="nome" required>
                    </div>
                    <div>
                        <label for="cnpj">CNPJ</label>
                    <input type="text" name="" id="cnpj" required>
                    </div>
                    
                    <div>
                        <label for="tel">Telefone comercial</label>
                    <input type="tel" name="" id="tel" required>
                    </div>
                <button type="submit">
                        <div class="prosseguir">Prosseguir</div>
                        <img src="../assets/seta.png" alt="">
                </button>
                </form>
