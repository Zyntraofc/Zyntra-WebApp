<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correção do Botão Prosseguir</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap');
        
        body {
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 500px;
        }
        
        h1 {
            color: #3A47FF;
            text-align: center;
            margin-bottom: 30px;
        }
        
        h3 {
            color: #3A47FF;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #9299FF;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #eaeaea;
            border-radius: 90px;
            font-size: 15px;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            border-color: #9299FF;
            outline: none;
        }
        
        /* ESTILO CORRETO DO BOTÃO PROSSEGUIR */
        .button-prosseguir {
            display: flex;
            justify-content: flex-end;
            margin-top: 30px;
            width: 100%;
        }
        
        .button-prosseguir button {
            background: none;
            border: none;
            color: #3A47FF;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-radius: 30px;
            transition: all 0.3s;
        }
        
        .button-prosseguir button:hover {
            background: rgba(58, 71, 255, 0.1);
        }
        
        .button-prosseguir img {
            width: 20px;
            height: 20px;
        }
        
        .code-explanation {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            font-size: 14px;
        }
        
        .code-explanation h4 {
            color: #3A47FF;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cadastre-se</h1>
        <h3>Dados da empresa</h3>
        
        <div class="form-group">
            <label for="nome">Nome da empresa</label>
            <input type="text" id="nome" required>
        </div>
        
        <div class="form-group">
            <label for="cnpj">CNPJ</label>
            <input type="text" id="cnpj" required>
        </div>
        
        <div class="form-group">
            <label for="tel">Telefone comercial</label>
            <input type="tel" id="tel" required>
        </div>
        
        <!-- BOTÃO CORRETO - Esta é a solução -->
        <div class="button-prosseguir">
            <button type="submit">
                Prosseguir
                <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiMzYTQ3ZmYiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNNSAxMmgxNE0xMiA1bDcgNy03IDciPjwvcGF0aD48L3N2Zz4=" alt="Seta">
            </button>
        </div>
        
        <div class="code-explanation">
            <h4>O que foi corrigido:</h4>
            <p>1. Estrutura simplificada - removi divs desnecessárias dentro do botão</p>
            <p>2. Uso de flexbox para alinhamento perfeito</p>
            <p>3. Botão com display:flex, align-items:center e gap para espaçamento</p>
            <p>4. Estilos de hover para melhor experiência do usuário</p>
        </div>
    </div>
</body>
</html>
